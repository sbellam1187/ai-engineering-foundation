# ══════════════════════════════════════════════════════════════════════════════
# Security CodeQL Auto-Remediation Workflow
# ══════════════════════════════════════════════════════════════════════════════
#
# WHAT IT DOES:
#   1. Fetches open CodeQL alerts from this repo
#   2. Creates required labels (codeql, SAST, code-scanning, etc.)
#   3. Groups alerts by rule — one consolidated issue per rule
#   4. Assigns each issue to @copilot with full context + guardrail comment
#   5. When Copilot opens a PR — assigns Copilot for review + requests human
#   6. Sends email summary
#
# REQUIRED SECRETS:
#   SECURITY_PAT         — PAT with repo, security_events, workflow scopes
#   EMAILME_SECRET_CONFIG — AAInternal/emailMe service config
#
# SCHEDULE: Daily at 8 AM CST (14:00 UTC)
# MANUAL:   workflow_dispatch with severity filter, dry run
# ══════════════════════════════════════════════════════════════════════════════
name: Security CodeQL Auto-Remediation
on:
 schedule:
   - cron: '0 14 * * *'
 workflow_dispatch:
   inputs:
     severity_filter:
       description: 'Severity: critical, high, medium, low, or all'
       required: false
       default: 'critical,high'
       type: string
     max_alerts:
       description: 'Max alerts to process (1-50)'
       required: false
       default: '20'
       type: string
     force_recreate:
       description: 'Force recreate existing issues'
       required: false
       default: false
       type: boolean
     dry_run:
       description: 'Dry run — list alerts only, no issues created'
       required: false
       default: false
       type: boolean
 pull_request:
   types: [opened, synchronize]
permissions:
 contents: write
 issues: write
 pull-requests: write
 security-events: read
jobs:
 # ── Job 1: Create issues and assign Copilot ────────────────────────────────
 create-issues:
   name: Create CodeQL Issues → Assign Copilot
   runs-on: ubuntu-latest
   if: github.event_name != 'pull_request'
   env:
     SEVERITY_FILTER: ${{ inputs.severity_filter || 'critical,high' }}
     MAX_ALERTS: ${{ inputs.max_alerts || '20' }}
     FORCE_RECREATE: ${{ inputs.force_recreate || 'false' }}
     MAX_ALERTS_PER_ISSUE: '15'
     SOURCE_CONTEXT_LINES: '5'
   steps:
     - name: Checkout
       uses: actions/checkout@v4
     - name: Create labels
       env:
         GH_TOKEN: ${{ secrets.SECURITY_PAT }}
       run: |
         gh label create "security"           --color "ee0701" --description "Security vulnerability"                  2>/dev/null || true
         gh label create "copilot-security-fix" --color "d73a49" --description "Assigned to Copilot for automated fix" 2>/dev/null || true
         gh label create "code-scanning"      --color "5319e7" --description "CodeQL code scanning finding"            2>/dev/null || true
         gh label create "codeql"             --color "0075ca" --description "CodeQL SAST finding"                     2>/dev/null || true
         gh label create "SAST"               --color "fbca04" --description "Static Application Security Testing"     2>/dev/null || true
         gh label create "automated"          --color "0e8a16" --description "Automatically generated by workflow"     2>/dev/null || true
     - name: Fetch CodeQL alerts
       id: get_alerts
       if: inputs.dry_run != 'true'
       env:
         GH_TOKEN: ${{ secrets.SECURITY_PAT }}
       run: |
         REPO="${{ github.repository }}"
         MAX=$(( MAX_ALERTS > 50 ? 50 : (MAX_ALERTS < 1 ? 1 : MAX_ALERTS) ))
         echo "Fetching up to ${MAX} open CodeQL alerts..."
         ALERTS_JSON=$(gh api "/repos/${REPO}/code-scanning/alerts" \
           -X GET \
           -F state=open \
           -F per_page="${MAX}" \
           --jq 'if type == "array" then . else [] end' 2>/dev/null || echo '[]')
         if [[ "${SEVERITY_FILTER,,}" != "all" ]]; then
           ALERTS_JSON=$(echo "$ALERTS_JSON" | jq --arg sevs "$SEVERITY_FILTER" '
             ($sevs | split(",") | map(ltrimstr(" ") | rtrimstr(" "))) as $sev_list |
             [.[] | select(
               ((.rule.security_severity_level // "") | . != "" and (. as $l | $sev_list | index($l) != null)) or
               ((.rule.severity // "") | . != "" and (. as $s | $sev_list | index($s) != null))
             )]
           ')
         fi
         COUNT=$(echo "$ALERTS_JSON" | jq 'length')
         echo "Found ${COUNT} alert(s) matching filter"
         echo "alert_count=${COUNT}" >> "$GITHUB_OUTPUT"
         echo "$ALERTS_JSON" > /tmp/codeql_alerts.json
     - name: Create issues and assign Copilot
       id: create_issues
       if: inputs.dry_run != 'true' && steps.get_alerts.outputs.alert_count != '0'
       env:
         GH_TOKEN: ${{ secrets.SECURITY_PAT }}
       run: |
         REPO="${{ github.repository }}"
         REPO_URL="https://github.com/${REPO}"
         REF="${{ github.ref_name || 'main' }}"
         ALERTS_JSON=$(cat /tmp/codeql_alerts.json)
         COUNT=$(echo "$ALERTS_JSON" | jq 'length')
         CREATED=0
         SKIPPED=0
         CLOSED=0
         RULE_DESCRIPTIONS=$(echo "$ALERTS_JSON" | jq -r '[.[].rule.description] | unique | .[]')
         echo "Found ${COUNT} alert(s), grouping by rule..."
         while IFS= read -r RULE_DESC; do
           GROUP_JSON=$(echo "$ALERTS_JSON" | jq --arg desc "$RULE_DESC" '[.[] | select(.rule.description == $desc)]')
           GROUP_COUNT=$(echo "$GROUP_JSON" | jq 'length')
           FIRST_ALERT=$(echo "$GROUP_JSON" | jq '.[0]')
           RULE_ID=$(echo "$FIRST_ALERT" | jq -r '.rule.id')
           SEVERITY=$(echo "$FIRST_ALERT" | jq -r '.rule.severity')
           # Detect language from file extension
           FIRST_FILE=$(echo "$FIRST_ALERT" | jq -r '.most_recent_instance.location.path // ""')
           EXT="${FIRST_FILE##*.}"
           case "$EXT" in
             java|kt|groovy) LANGUAGE="java" ;;
             js|ts|jsx|tsx|mjs|cjs) LANGUAGE="javascript" ;;
             py) LANGUAGE="python" ;;
             cs) LANGUAGE="csharp" ;;
             go) LANGUAGE="go" ;;
             rb|erb) LANGUAGE="ruby" ;;
             cpp|c|h|cc) LANGUAGE="cpp" ;;
             swift) LANGUAGE="swift" ;;
             *) LANGUAGE="unknown" ;;
           esac
           echo "  Detected language: ${LANGUAGE}"
           SEC_SEVERITY=$(echo "$FIRST_ALERT" | jq -r '.rule.security_severity_level // empty')
           HELP=$(echo "$FIRST_ALERT" | jq -r '.rule.help // "Please implement a fix following security best practices."' | head -c 500)
           HELP_URI=$(echo "$FIRST_ALERT" | jq -r '.rule.help_uri // "N/A"')
           ISSUE_TITLE="[CodeQL] ${RULE_DESC}"
           SAFE_RULE_ID=$(echo "${RULE_ID}" | tr '/' '__')
           MARKER="<!-- CODEQL_RULE_${SAFE_RULE_ID} -->"
           echo "=== Rule: ${RULE_DESC} (${GROUP_COUNT} alert(s)) ==="
           # Dedup check
           CANDIDATES=$(gh issue list \
             --repo "${REPO}" \
             --state open \
             --search "CODEQL_RULE_${SAFE_RULE_ID} in:body" \
             --json number,body \
             --jq '.' 2>/dev/null || echo '[]')
           EXISTING=""
           for candidate in $(echo "$CANDIDATES" | jq -r '.[].number'); do
             CANDIDATE_BODY=$(echo "$CANDIDATES" | jq -r --arg num "$candidate" '.[] | select(.number == ($num | tonumber)) | .body')
             if echo "$CANDIDATE_BODY" | grep -qF "CODEQL_RULE_${SAFE_RULE_ID}"; then
               EXISTING="$candidate"; break
             fi
           done
           if [[ -n "$EXISTING" && "$FORCE_RECREATE" != "true" ]]; then
             echo "  ✅ Issue #${EXISTING} already exists — skipping"
             SKIPPED=$((SKIPPED + GROUP_COUNT))
             continue
           fi
           if [[ -n "$EXISTING" && "$FORCE_RECREATE" == "true" ]]; then
             gh issue close "${EXISTING}" --repo "${REPO}" \
               --comment "Closed by workflow to recreate with updated information."
             CLOSED=$((CLOSED + 1))
           fi
           # CWE + OWASP mapping
           CWE_IDS=$(echo "$FIRST_ALERT" | jq -r '[.rule.tags[]? | select(startswith("external/cwe/")) | ltrimstr("external/cwe/") | ascii_upcase] | unique | join(", ")' 2>/dev/null || echo "")
           FULL_DESC=$(echo "$FIRST_ALERT" | jq -r '.rule.full_description // .rule.description // ""')
           OWASP_CATS=""
           if echo "$CWE_IDS" | grep -qiE "CWE-79|CWE-80";          then OWASP_CATS="${OWASP_CATS}A03:2021 Injection (XSS), "; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-89|CWE-90|CWE-91";   then OWASP_CATS="${OWASP_CATS}A03:2021 Injection (SQL/LDAP), "; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-78|CWE-77";           then OWASP_CATS="${OWASP_CATS}A03:2021 Injection (OS Command), "; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-918";                 then OWASP_CATS="${OWASP_CATS}A10:2021 SSRF, "; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-22|CWE-23|CWE-36";   then OWASP_CATS="${OWASP_CATS}A01:2021 Broken Access Control (Path Traversal), "; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-502|CWE-94|CWE-95";  then OWASP_CATS="${OWASP_CATS}A08:2021 Data Integrity Failures, "; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-611|CWE-776";         then OWASP_CATS="${OWASP_CATS}A05:2021 Security Misconfiguration (XXE), "; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-327|CWE-328|CWE-330";then OWASP_CATS="${OWASP_CATS}A02:2021 Cryptographic Failures, "; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-200|CWE-209|CWE-532";then OWASP_CATS="${OWASP_CATS}A01:2021 Broken Access Control (Info Exposure), "; fi
           OWASP_CATS="${OWASP_CATS%,*}"
           if [[ -z "$OWASP_CATS" ]]; then OWASP_CATS="Check OWASP Top 10"; fi
           FIX_HINT=""
           if echo "$CWE_IDS" | grep -qiE "CWE-918"; then FIX_HINT="SSRF: Hardcode base URL, validate path segment. For full URL — allowlist hosts, block private IPs."; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-22|CWE-23|CWE-36"; then FIX_HINT="Path Traversal: Resolve path, verify starts with base dir. Never concatenate user input."; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-79|CWE-80"; then FIX_HINT="XSS: Encode output for context (HTML/JS/URL). Use framework auto-escaping. Return JSON where possible."; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-89|CWE-90|CWE-91"; then FIX_HINT="SQL Injection: Use parameterized queries, ORM methods, or prepared statements. Never concatenate user input."; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-78|CWE-77"; then FIX_HINT="Command Injection: Use argument array (no shell). Prefer language stdlib over exec."; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-611|CWE-776"; then FIX_HINT="XXE: Disable DTD and external entities on XML parser factory."; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-502"; then FIX_HINT="Deserialization: Use JSON/typed deserialization. Add class allowlist filter if native serialization required."; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-200|CWE-209|CWE-532"; then FIX_HINT="Info Exposure: Return generic error messages. Log detail server-side only. Never expose stack traces."; fi
           if echo "$CWE_IDS" | grep -qiE "CWE-327|CWE-328|CWE-338"; then FIX_HINT="Weak Crypto: Replace MD5/SHA-1/DES/ECB. Use SHA-256, AES/GCM, SecureRandom."; fi
           {
             echo "## 🔒 CodeQL Security Finding — ${RULE_DESC}"
             echo ""
             echo "**Severity:** ${SEC_SEVERITY:-$SEVERITY} | **Rule:** \`${RULE_ID}\` | **Language:** ${LANGUAGE} | **Occurrences:** ${GROUP_COUNT}"
             echo ""
             echo "### 🏷️ Classification"
             echo "| Attribute | Value |"
             echo "| --- | --- |"
             echo "| **Language** | ${LANGUAGE} |"
             if [[ -n "$CWE_IDS" ]]; then echo "| **CWE** | ${CWE_IDS} |"; fi
             echo "| **OWASP Top 10** | ${OWASP_CATS} |"
             echo "| **Description** | ${FULL_DESC} |"
             echo ""
             echo "### 🎯 Fix Strategy"
             echo "📖 **Full patterns + code examples:** [\`.github/SECURITY_REMEDIATION_GUIDE.md\`](${REPO_URL}/blob/${REF}/.github/SECURITY_REMEDIATION_GUIDE.md)"
             echo ""
             echo "**Copilot skill routing:** Load \`references/${LANGUAGE}/\` folder from the \`security-codeql-fix\` skill — pick the file matching the CWE above"
             echo ""
             if [[ -n "$FIX_HINT" ]]; then
               echo "**Quick fix:** ${FIX_HINT}"
               echo ""
             fi
             echo "### 📚 Rule Reference"
             echo "- [CodeQL Query Help](${HELP_URI})"
             echo "- [CodeQL Source — github/codeql](https://github.com/github/codeql/tree/main/java/ql/src/Security/CWE)"
             echo ""
             echo "---"
             echo ""
             echo "## 📍 All Occurrences (${GROUP_COUNT} locations)"
             echo ""
             echo "Fix **all** locations in a **single PR**:"
             echo ""
           } > /tmp/issue_body.md
           ALERTS_CAP=${MAX_ALERTS_PER_ISSUE:-15}
           for j in $(seq 0 $((GROUP_COUNT - 1))); do
             A=$(echo "$GROUP_JSON" | jq ".[$j]")
             A_NUM=$(echo "$A" | jq -r '.number')
             A_FILE=$(echo "$A" | jq -r '.most_recent_instance.location.path')
             A_START=$(echo "$A" | jq -r '.most_recent_instance.location.start_line')
             A_END=$(echo "$A" | jq -r '.most_recent_instance.location.end_line')
             A_MSG=$(echo "$A" | jq -r '.most_recent_instance.message.text')
             A_URL=$(echo "$A" | jq -r '.html_url')
             A_CLASS=$(basename "$A_FILE")
             if [[ $j -ge $ALERTS_CAP ]]; then
               echo "- [ ] **Alert #${A_NUM}** — \`${A_CLASS}\` — [\`${A_FILE}\`](${REPO_URL}/blob/${REF}/${A_FILE}#L${A_START}-L${A_END}) (L${A_START}-${A_END}) — ${A_MSG}" >> /tmp/issue_body.md
               continue
             fi
             {
               echo "### Alert #${A_NUM} — \`${A_CLASS}\`"
               echo "- [ ] **File:** [\`${A_FILE}\`](${REPO_URL}/blob/${REF}/${A_FILE}#L${A_START}-L${A_END}) — Lines ${A_START}-${A_END}"
               echo "- **Issue:** ${A_MSG}"
               echo "- [View Alert](${A_URL})"
               echo ""
             } >> /tmp/issue_body.md
             CTX_LINES=${SOURCE_CONTEXT_LINES:-5}
             CONTEXT_START=$((A_START > CTX_LINES ? A_START - CTX_LINES : 1))
             CONTEXT_END=$((A_END + CTX_LINES))
             SOURCE_CODE=$(gh api "/repos/${REPO}/contents/${A_FILE}" \
               --jq '.content' 2>/dev/null \
               | base64 -d 2>/dev/null \
               | sed -n "${CONTEXT_START},${CONTEXT_END}p" 2>/dev/null || echo "")
             if [[ -n "$SOURCE_CODE" ]]; then
               LANG_EXT="${A_FILE##*.}"
               {
                 echo "<details>"
                 echo "<summary>📄 Source — lines ${A_START}-${A_END} (click to expand)</summary>"
                 echo ""
                 echo "\`\`\`${LANG_EXT}"
                 echo "// Lines ${CONTEXT_START}-${CONTEXT_END} of ${A_FILE}"
                 echo "${SOURCE_CODE}"
                 echo "\`\`\`"
                 echo "</details>"
                 echo ""
               } >> /tmp/issue_body.md
             fi
           done
           {
             echo "---"
             echo ""
             echo "## 🤖 Implementation Requirements"
             echo ""
             echo "@copilot — fix **all ${GROUP_COUNT} occurrences** in a **single PR**."
             echo ""
             echo "**Steps:** 1) Read CWE/OWASP above → 2) Review source code → 3) Apply fix strategy → 4) Add security test → 5) Run full test suite"
             echo ""
             echo "**Rules:**"
             echo "- Do NOT suppress alerts — fix root cause only"
             echo "- Do NOT call methods that don't exist — create them if needed"
             echo "- Do NOT reference config properties not already defined"
             echo "- Prefer framework-native patterns over manual implementations"
             echo "- Keep fix minimal — fewest lines necessary"
             echo "- All existing tests must pass"
             echo "- PR must reference this issue: \`Fixes #ISSUE_NUMBER\`"
             echo "- Do NOT merge your own PR — wait for security team approval"
             echo ""
             echo "---"
             echo "**Generated:** $(date -u +%Y-%m-%dT%H:%M:%SZ) | **Workflow:** CodeQL Auto-Remediation"
             echo ""
             echo "${MARKER}"
           } >> /tmp/issue_body.md
           ISSUE_URL=$(gh issue create \
             --repo "${REPO}" \
             --title "${ISSUE_TITLE}" \
             --body-file /tmp/issue_body.md \
             --assignee "@copilot" \
             --label "security,copilot-security-fix,code-scanning,codeql,SAST,automated")
           ISSUE_NUM="${ISSUE_URL##*/}"
           echo "✅ Created issue #${ISSUE_NUM}: ${ISSUE_URL}"
           {
             echo "@copilot — Remediation context for **${RULE_DESC}** (${GROUP_COUNT} occurrence(s)):"
             echo ""
             echo "**Language:** ${LANGUAGE} | **Rule:** \`${RULE_ID}\` | **CWE:** ${CWE_IDS:-N/A} | **OWASP:** ${OWASP_CATS} | **Severity:** ${SEC_SEVERITY:-$SEVERITY}"
             echo ""
             echo "**Skill routing:** Use \`security-codeql-fix\` skill → \`references/${LANGUAGE}/\` folder → file matching CWE above"
             echo ""
             echo "**Affected files:**"
             for j2 in $(seq 0 $((GROUP_COUNT - 1))); do
               AF=$(echo "$GROUP_JSON" | jq -r ".[$j2].most_recent_instance.location.path")
               AL=$(echo "$GROUP_JSON" | jq -r ".[$j2].most_recent_instance.location.start_line")
               AM=$(echo "$GROUP_JSON" | jq -r ".[$j2].most_recent_instance.message.text")
               echo "- \`$(basename "$AF")\` (line ${AL}): ${AM}"
             done
             echo ""
             echo "**⚠️ Critical Guardrails:**"
             echo "- Do NOT call methods that do not already exist — create them if needed"
             echo "- Do NOT reference config properties not already defined"
             echo "- Do NOT suppress CodeQL alerts with inline annotations"
             echo "- Do NOT move vulnerable code to another file to avoid detection"
             echo "- Prefer framework-native patterns over manual string manipulation"
             echo "- Keep fix minimal — fewest lines necessary"
             echo "- All existing tests must pass"
             echo "- PR description must reference: Fixes #${ISSUE_NUM}"
             echo "- Do NOT merge your own PR — wait for security team approval"
           } > /tmp/copilot_comment.md
           gh issue comment "${ISSUE_NUM}" \
             --repo "${REPO}" \
             --body-file /tmp/copilot_comment.md
           echo "<tr><td>${GROUP_COUNT}</td><td>${SEC_SEVERITY:-$SEVERITY}</td><td><code>${RULE_ID}</code></td><td>${RULE_DESC}</td><td><a href='${ISSUE_URL}'>#${ISSUE_NUM}</a></td></tr>" >> /tmp/issue_summary.html
           CREATED=$((CREATED + 1))
         done < <(echo "${RULE_DESCRIPTIONS}")
         echo "created_count=${CREATED}" >> "$GITHUB_OUTPUT"
         echo "skipped_count=${SKIPPED}" >> "$GITHUB_OUTPUT"
         echo "total_count=${COUNT}" >> "$GITHUB_OUTPUT"
         if [[ -f /tmp/issue_summary.html ]]; then
           ISSUE_ROWS=$(cat /tmp/issue_summary.html)
         else
           ISSUE_ROWS="<tr><td colspan='5'>No new issues created</td></tr>"
         fi
         echo "issue_rows<<ROWS_EOF" >> "$GITHUB_OUTPUT"
         echo "${ISSUE_ROWS}" >> "$GITHUB_OUTPUT"
         echo "ROWS_EOF" >> "$GITHUB_OUTPUT"
     - name: Dry run — list alerts
       if: inputs.dry_run == 'true'
       env:
         GH_TOKEN: ${{ secrets.SECURITY_PAT }}
       run: |
         gh api "/repos/${{ github.repository }}/code-scanning/alerts" \
           -X GET -F state=open -F per_page=50 \
           --jq '.[] | "[\(.rule.security_severity_level // .rule.severity)] \(.rule.description) — \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' \
           2>/dev/null || echo "No alerts found or CodeQL not enabled"
     - name: Email notification
       if: steps.create_issues.outputs.created_count != '0' && steps.create_issues.outputs.created_count != ''
       uses: AAInternal/emailMe@v1
       with:
         emailTo: "Rajkiran.Medaveni@aa.com, NagaPrasad.Kondaboina@aa.com"
         subject: "${{ github.repository }} — CodeQL Auto-Remediation Summary"
         message: |
           <center>
           <h1>🔒 ${{ github.repository }}</h1>
           <h2>CodeQL Auto-Remediation Summary</h2>
           <b>Trigger:</b> ${{ github.event_name }}<br>
           <b>Run:</b> #${{ github.run_number }}<br>
           <b>Actor:</b> ${{ github.actor }}<br>
           <br>
           <h3>📊 Summary</h3>
           <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;">
           <tr style="background:#f0f0f0;"><th>Metric</th><th>Count</th></tr>
           <tr><td>✅ Issues Created</td><td><b>${{ steps.create_issues.outputs.created_count || '0' }}</b></td></tr>
           <tr><td>⏭️ Skipped (exist)</td><td>${{ steps.create_issues.outputs.skipped_count || '0' }}</td></tr>
           <tr><td>📋 Total Alerts</td><td>${{ steps.create_issues.outputs.total_count || '0' }}</td></tr>
           </table>
           <br>
           <h3>🔍 Issues Created</h3>
           <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;">
           <tr style="background:#f0f0f0;"><th>Alerts</th><th>Severity</th><th>Rule</th><th>Description</th><th>Issue</th></tr>
           ${{ steps.create_issues.outputs.issue_rows || '<tr><td colspan="5">No new issues</td></tr>' }}
           </table>
           <br>
           <p><i>Copilot will auto-fix these findings and open PRs for security team review.</i></p>
           <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a></p>
           </center>
         secretConfig: ${{ secrets.EMAILME_SECRET_CONFIG }}
 # ── Job 2: PR opened by Copilot — assign for review ───────────────────────
 assign-pr-for-review:
   name: Assign Copilot PR for Review
   runs-on: ubuntu-latest
   if: |
     github.event_name == 'pull_request' &&
     (github.event.action == 'opened' || github.event.action == 'synchronize')
   steps:
     - name: Check if this is a Copilot security PR
       id: check_pr
       env:
         GH_TOKEN: ${{ secrets.SECURITY_PAT }}
       run: |
         PR_NUMBER="${{ github.event.pull_request.number }}"
         REPO="${{ github.repository }}"
         PR_BODY=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')
         PR_AUTHOR=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.user.login')
         echo "PR author: ${PR_AUTHOR}"
         if echo "$PR_BODY" | grep -qF "CODEQL_RULE_" || \
            echo "$PR_AUTHOR" | grep -qiE "copilot"; then
           echo "is_security_pr=true" >> "$GITHUB_OUTPUT"
           echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
         else
           echo "is_security_pr=false" >> "$GITHUB_OUTPUT"
         fi
     - name: Add labels to PR
       if: steps.check_pr.outputs.is_security_pr == 'true'
       env:
         GH_TOKEN: ${{ secrets.SECURITY_PAT }}
       run: |
         gh pr edit "${{ steps.check_pr.outputs.pr_number }}" \
           --repo "${{ github.repository }}" \
           --add-label "security,copilot-security-fix,code-scanning,codeql,SAST" 2>/dev/null || true
     - name: Request Copilot as reviewer
       if: steps.check_pr.outputs.is_security_pr == 'true'
       env:
         GH_TOKEN: ${{ secrets.SECURITY_PAT }}
       run: |
         PR_NUMBER="${{ steps.check_pr.outputs.pr_number }}"
         REPO="${{ github.repository }}"
         gh pr edit "${PR_NUMBER}" \
           --repo "${REPO}" \
           --add-assignee "copilot" 2>/dev/null || true
         echo "✅ PR #${PR_NUMBER} ready for security team review"
     - name: Post human sign-off comment
       if: steps.check_pr.outputs.is_security_pr == 'true'
       env:
         GH_TOKEN: ${{ secrets.SECURITY_PAT }}
       run: |
         PR_NUMBER="${{ steps.check_pr.outputs.pr_number }}"
         REPO="${{ github.repository }}"
         gh pr comment "${PR_NUMBER}" \
           --repo "${REPO}" \
           --body "## 🔒 Security Agent — CodeQL Fix PR
