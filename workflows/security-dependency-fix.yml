# ══════════════════════════════════════════════════════════════════════════════
# Security Dependency Auto-Remediation Workflow
# ══════════════════════════════════════════════════════════════════════════════
#
# WHAT IT DOES:
#   1. Fetches open Dependabot HIGH/CRITICAL alerts
#   2. Creates required labels (dependabot, security-master, security-sub-issue etc.)
#   3. Creates one sub-issue per CVE (tracking only)
#   4. Creates one master issue assigned to @copilot covering all CVEs in one PR
#   5. When Copilot opens a PR — assigns Copilot for review + posts human sign-off gate
#   6. When master issue is closed — auto-closes all sub-issues
#   7. Sends email summary
#
# REQUIRED SECRETS:
#   SECURITY_PAT          — PAT with repo, security_events, workflow scopes
#   EMAILME_SECRET_CONFIG — AAInternal/emailMe service config
#
# SCHEDULE: Daily at 7 AM CST (13:00 UTC)
# MANUAL:   workflow_dispatch with dry run option
# ══════════════════════════════════════════════════════════════════════════════

name: Security Dependency Auto-Remediation

on:
  schedule:
    - cron: '0 13 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — list alerts only, no issues created'
        required: false
        default: false
        type: boolean
      force_recreate:
        description: 'Force recreate master issue even if one exists'
        required: false
        default: false
        type: boolean

  pull_request:
    types: [opened, synchronize]

  issues:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  security-events: read

jobs:

  # ── Job 1: Create sub-issues + master issue → assign Copilot ──────────────
  create-issues:
    name: Create Dependency Issues → Assign Copilot
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.event_name != 'issues'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create labels
        env:
         GH_TOKEN: ${{ secrets.SECURITY_PAT }}
        run: |
          gh label create "security"             --color "ee0701" --description "Security vulnerability"                       2>/dev/null || true
          gh label create "copilot-security-fix" --color "d73a49" --description "Assigned to Copilot for automated fix"        2>/dev/null || true
          gh label create "security-master"      --color "b60205" --description "Master security fix issue — single PR target"  2>/dev/null || true
          gh label create "security-sub-issue"   --color "e4e669" --description "CVE tracking sub-issue"                       2>/dev/null || true
          gh label create "dependabot"           --color "0366d6" --description "Dependabot security alert"                    2>/dev/null || true
          gh label create "dependencies"         --color "0075ca" --description "Dependency version update"                    2>/dev/null || true
          gh label create "automated"            --color "0e8a16" --description "Automatically generated by workflow"           2>/dev/null || true

      - name: Fetch Dependabot alerts
        id: get_alerts
        if: inputs.dry_run != 'true'
        env:
         GH_TOKEN: ${{ secrets.SECURITY_PAT }}
        run: |
          echo "Fetching open HIGH/CRITICAL Dependabot alerts..."

          ALERTS=$(gh api \
            "repos/${{ github.repository }}/dependabot/alerts?state=open&severity=high,critical&per_page=100" \
            --paginate \
            --jq '[.[] | select(.security_vulnerability.severity == "high" or .security_vulnerability.severity == "critical")]' \
            2>/dev/null) || {
            echo "::error::Failed to fetch Dependabot alerts. Check SECURITY_PAT has security_events scope."
            exit 1
          }

          COUNT=$(echo "$ALERTS" | jq 'length')
          echo "Found ${COUNT} open HIGH/CRITICAL Dependabot alerts"
          echo "$ALERTS" > /tmp/dependabot_alerts.json
          echo "alert_count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Check for existing master issue
        id: check_master
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT }}
        run: |
          MASTER=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "copilot-security-fix,security-master" \
            --state open \
            --json number,title \
            --jq '.[0].number // empty' 2>/dev/null)

          if [[ -n "$MASTER" && "${{ inputs.force_recreate }}" != "true" ]]; then
            echo "Master issue #${MASTER} already exists — skipping"
            echo "master_exists=true" >> "$GITHUB_OUTPUT"
            echo "master_number=${MASTER}" >> "$GITHUB_OUTPUT"
          else
            echo "No open master issue — will create"
            echo "master_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get existing sub-issues
        id: check_sub_issues
        run: |
          gh issue list \
            --repo "${{ github.repository }}" \
            --label "security-sub-issue" \
            --state open \
            --json title \
            --jq '.[].title' > /tmp/existing_sub_issues.txt 2>/dev/null || true
          echo "Existing sub-issues:"
          cat /tmp/existing_sub_issues.txt

      - name: Dry run — list alerts
        if: inputs.dry_run == 'true'
        run: |
          echo "=== DRY RUN ==="
          cat /tmp/dependabot_alerts.json | jq -r \
            '.[] | "[\(.security_vulnerability.severity | ascii_upcase)] \(.security_vulnerability.package.name) — CVE: \(.security_advisory.cve_id // "N/A") — Fix: \(.security_vulnerability.first_patched_version.identifier // "latest")"'

      - name: Create sub-issues and master issue
        id: create_issues
        if: |
          inputs.dry_run != 'true' &&
          steps.get_alerts.outputs.alert_count != '0' &&
          steps.check_master.outputs.master_exists != 'true'
        env:
         GH_TOKEN: ${{ secrets.SECURITY_PAT }}
        run: |
          REPO="${{ github.repository }}"
          ALERTS_FILE="/tmp/dependabot_alerts.json"
          EXISTING_FILE="/tmp/existing_sub_issues.txt"

          total_alerts=$(jq 'length' "$ALERTS_FILE")
          echo "Processing ${total_alerts} alerts..."

          sub_issue_numbers=""
          sub_issue_refs=""
          master_body_vulnerabilities=""
          created_count=0
          skipped_count=0
          failed_count=0
          today=$(date +%Y%m%d)
          today_display=$(date +%Y-%m-%d)

          # ── Phase 1: Sub-issue per CVE ──────────────────────────────────
          for ((i=0; i<total_alerts; i++)); do
            echo "--- Alert $((i+1)) of ${total_alerts} ---"

            alert=$(jq -c ".[$i]" "$ALERTS_FILE")
            alert_number=$(echo "$alert" | jq -r '.number')
            package_name=$(echo "$alert" | jq -r '.security_vulnerability.package.name')
            severity=$(echo "$alert" | jq -r '.security_vulnerability.severity')
            vulnerable_version=$(echo "$alert" | jq -r '.security_vulnerability.vulnerable_version_range')
            patched_version=$(echo "$alert" | jq -r '.security_vulnerability.first_patched_version.identifier // "latest"')
            cve_id=$(echo "$alert" | jq -r '.security_advisory.cve_id // "N/A"')
            advisory_summary=$(echo "$alert" | jq -r '.security_advisory.summary')
            advisory_url=$(echo "$alert" | jq -r '.html_url')
            severity_upper=$(echo "$severity" | tr '[:lower:]' '[:upper:]')
            ecosystem=$(echo "$alert" | jq -r '.security_vulnerability.package.ecosystem // "unknown"')

            sub_title="[Security-Sub] ${severity_upper} - ${package_name} (${cve_id})"

            if grep -Fxq "$sub_title" "$EXISTING_FILE" 2>/dev/null; then
              echo "  SKIPPED: Sub-issue already exists for ${package_name}"
              skipped_count=$((skipped_count + 1))
              continue
            fi

            {
              echo "## Vulnerability Details"
              echo ""
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| **Alert #** | ${alert_number} |"
              echo "| **Package** | \`${package_name}\` |"
              echo "| **Ecosystem** | ${ecosystem} |"
              echo "| **Severity** | ${severity_upper} |"
              echo "| **CVE** | ${cve_id} |"
              echo "| **Vulnerable Versions** | ${vulnerable_version} |"
              echo "| **Patched Version** | ${patched_version} |"
              echo ""
              echo "### Description"
              echo "${advisory_summary}"
              echo ""
              echo "### Dependabot Alert"
              echo "${advisory_url}"
              echo ""
              echo "---"
              echo "> ℹ️ This is a **tracking sub-issue**. The actual fix is delivered via the master security issue assigned to Copilot."
            } > /tmp/sub_issue_body.md

            if sub_url=$(gh issue create \
              --repo "${REPO}" \
              --title "$sub_title" \
              --body-file /tmp/sub_issue_body.md \
              --label "security-sub-issue,security,dependabot,dependencies,automated" 2>&1); then

              sub_num=$(echo "$sub_url" | grep -oE '[0-9]+$')
              echo "  ✅ Created sub-issue #${sub_num}: ${sub_title}"

              sub_issue_numbers="${sub_issue_numbers} ${sub_num}"
              sub_issue_refs="${sub_issue_refs}
          - [ ] #${sub_num} — ${severity_upper}: \`${package_name}\` (${cve_id}) → fix to \`${patched_version}\`"

              master_body_vulnerabilities="${master_body_vulnerabilities}
          ### $((created_count + 1)). \`${package_name}\` (${cve_id}) — ${severity_upper}
          | Field | Value |
          |-------|-------|
          | **Alert #** | ${alert_number} |
          | **Package** | \`${package_name}\` |
          | **Ecosystem** | ${ecosystem} |
          | **Severity** | ${severity_upper} |
          | **CVE** | ${cve_id} |
          | **Vulnerable Versions** | ${vulnerable_version} |
          | **Patched Version** | \`${patched_version}\` |

          ${advisory_summary}
          [View Dependabot Alert](${advisory_url})
          "
              created_count=$((created_count + 1))
            else
              echo "  FAILED: ${sub_url}"
              failed_count=$((failed_count + 1))
            fi

            sleep 2
          done

          # ── Phase 2: Master issue assigned to Copilot ───────────────────
          if [[ "$created_count" -eq 0 ]]; then
            echo "No new sub-issues created — skipping master issue"
            echo "created_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo "Creating master issue for ${created_count} vulnerabilities..."

          {
            echo "## 🔒 Security Dependency Batch Fix"
            echo ""
            echo "This master issue tracks **${created_count}** HIGH/CRITICAL Dependabot vulnerabilities."
            echo "Fix all of them in a **single PR**."
            echo ""
            echo "### Sub-Issues (Tracked CVEs)"
            echo "${sub_issue_refs}"
            echo ""
            echo "---"
            echo ""
            echo "## Vulnerability Details"
            echo "${master_body_vulnerabilities}"
            echo ""
            echo "---"
            echo ""
            echo "## 🤖 Instructions for Copilot"
            echo ""
            echo "Fix **all** vulnerabilities listed above by:"
            echo ""
            echo "1. Update each affected dependency to the patched version in \`build.gradle\` or \`pom.xml\`"
            echo "2. Check for transitive dependencies — try upgrading the parent first before using constraints"
            echo "3. Run \`./gradlew clean build test\` (or Maven equivalent) to validate all changes"
            echo "4. Ensure no new vulnerabilities are introduced"
            echo "5. Create a **single PR** covering all vulnerabilities in this issue"
            echo ""
            echo "### PR Requirements"
            echo "- **Branch:** \`security/batch-fix-${today}\`"
            echo "- **Title:** \`fix(security): batch fix ${created_count} HIGH/CRITICAL dependency vulnerabilities\`"
            echo "- Reference this issue: \`Fixes #ISSUE_NUMBER\`"
            echo "- All existing tests must pass"
            echo "- Do NOT modify the \`repositories\` block — do not add public repos"
            echo "- Do NOT merge your own PR — wait for security team approval"
            echo ""
            echo "📖 **Fix patterns:** [\`.github/DEPENDENCY_REMEDIATION_GUIDE.md\`](.github/DEPENDENCY_REMEDIATION_GUIDE.md)"
            echo ""
            echo "---"
            echo "> Auto-generated by Security Dependency Auto-Remediation workflow — ${today_display}"
            echo "> When this master issue is closed, all sub-issues will be automatically closed."
          } > /tmp/master_issue_body.md

          master_title="[Security-Master] Fix ${created_count} HIGH/CRITICAL dependency vulnerabilities (${today_display})"

          if master_url=$(gh issue create \
            --repo "${REPO}" \
            --title "$master_title" \
            --body-file /tmp/master_issue_body.md \
            --assignee "@copilot" \
            --label "copilot-security-fix,security,security-master,dependabot,dependencies,automated" 2>&1); then

            master_num=$(echo "$master_url" | grep -oE '[0-9]+$')
            echo "✅ Created master issue #${master_num}: ${master_url}"
            echo "master_number=${master_num}" >> "$GITHUB_OUTPUT"

            # Post guardrail comment to master issue
            {
              echo "@copilot — Security dependency remediation context:"
              echo ""
              echo "**Task:** Fix **${created_count}** HIGH/CRITICAL dependency vulnerabilities in a **single PR**"
              echo ""
              echo "**Vulnerabilities to fix:**"
              echo "${sub_issue_refs}"
              echo ""
              echo "**⚠️ Critical Guardrails:**"
              echo "- Do NOT modify the \`repositories\` block — never add public Maven/npm registries"
              echo "- Try upgrading the parent dependency FIRST before using constraints or resolution strategy"
              echo "- If a version is unavailable in the private registry — report it, do not add public repos"
              echo "- All existing tests must pass"
              echo "- Single PR covering all fixes — do not create separate PRs per CVE"
              echo "- PR must reference: \`Fixes #${master_num}\`"
              echo "- Do NOT merge your own PR — wait for security team approval"
            } > /tmp/master_comment.md

            gh issue comment "${master_num}" \
              --repo "${REPO}" \
              --body-file /tmp/master_comment.md

            # Link sub-issues back to master
            for sub_num in $sub_issue_numbers; do
              gh issue comment "${sub_num}" \
                --repo "${REPO}" \
                --body "Tracked by master issue #${master_num}. The fix will be delivered in a single PR." 2>/dev/null || true
              sleep 1
            done

            echo "created_count=${created_count}" >> "$GITHUB_OUTPUT"
            echo "skipped_count=${skipped_count}" >> "$GITHUB_OUTPUT"
            echo "total_count=${total_alerts}" >> "$GITHUB_OUTPUT"
            echo "master_url=${master_url}" >> "$GITHUB_OUTPUT"
          else
            echo "FAILED to create master issue: ${master_url}"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "SUMMARY:"
          echo "  Total alerts:    ${total_alerts}"
          echo "  Sub-issues created: ${created_count}"
          echo "  Sub-issues skipped: ${skipped_count}"
          echo "  Sub-issues failed:  ${failed_count}"
          echo "  Master issue:    #${master_num}"
          echo "========================================"

      - name: Email notification
        if: steps.create_issues.outputs.created_count != '0' && steps.create_issues.outputs.created_count != ''
        uses: AAInternal/emailMe@v1
        with:
          emailTo: "DL_SecurityEngineering@aa.com"
          subject: "${{ github.repository }} — Dependency Auto-Remediation Summary"
          message: |
            <center>
            <h1>🔒 ${{ github.repository }}</h1>
            <h2>Dependency Auto-Remediation Summary</h2>
            <b>Trigger:</b> ${{ github.event_name }}<br>
            <b>Run:</b> #${{ github.run_number }}<br>
            <b>Actor:</b> ${{ github.actor }}<br>
            <br>
            <h3>📊 Summary</h3>
            <table border="1" cellpadding="8" cellspacing="0" style="border-collapse:collapse;">
            <tr style="background:#f0f0f0;"><th>Metric</th><th>Count</th></tr>
            <tr><td>✅ Sub-Issues Created</td><td><b>${{ steps.create_issues.outputs.created_count || '0' }}</b></td></tr>
            <tr><td>⏭️ Skipped (exist)</td><td>${{ steps.create_issues.outputs.skipped_count || '0' }}</td></tr>
            <tr><td>📋 Total Alerts</td><td>${{ steps.create_issues.outputs.total_count || '0' }}</td></tr>
            </table>
            <br>
            <p>Master issue assigned to Copilot: <a href="${{ steps.create_issues.outputs.master_url }}">${{ steps.create_issues.outputs.master_url }}</a></p>
            <p><i>Copilot will fix all vulnerabilities in a single PR for security team review.</i></p>
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a></p>
            </center>
          secretConfig: ${{ secrets.EMAILME_SECRET_CONFIG }}

  # ── Job 2: PR opened by Copilot — assign for review ───────────────────────
  assign-pr-for-review:
    name: Assign Copilot PR for Review
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'synchronize')

    steps:
      - name: Check if this is a Copilot security PR
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"

          PR_BODY=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')
          PR_AUTHOR=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.user.login')
          PR_BRANCH=$(gh api "/repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.ref')

          echo "PR author: ${PR_AUTHOR} | Branch: ${PR_BRANCH}"

          # Detect security PRs — Copilot author, security branch, or security keyword in body
          if echo "$PR_AUTHOR" | grep -qiE "copilot" || \
             echo "$PR_BRANCH" | grep -qiE "^security/" || \
             echo "$PR_BODY" | grep -qiE "security-master|batch.fix.*vulnerabilit"; then
            echo "is_security_pr=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "is_security_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add labels to PR
        if: steps.check_pr.outputs.is_security_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT }}
        run: |
          gh pr edit "${{ steps.check_pr.outputs.pr_number }}" \
            --repo "${{ github.repository }}" \
            --add-label "security,copilot-security-fix,dependabot,dependencies" 2>/dev/null || true

      - name: Request Copilot as reviewer
        if: steps.check_pr.outputs.is_security_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT }}
        run: |
          PR_NUMBER="${{ steps.check_pr.outputs.pr_number }}"
          REPO="${{ github.repository }}"

          # Re-assign Copilot on the PR for review
          gh pr edit "${PR_NUMBER}" \
            --repo "${REPO}" \
            --add-assignee "copilot" 2>/dev/null || true

          echo "✅ PR #${PR_NUMBER} ready for security team review"

      - name: Post human sign-off gate comment
        if: steps.check_pr.outputs.is_security_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT }}
        run: |
          PR_NUMBER="${{ steps.check_pr.outputs.pr_number }}"
          REPO="${{ github.repository }}"

          gh pr comment "${PR_NUMBER}" \
            --repo "${REPO}" \
            --body "## 🔒 Security Agent — Dependency Fix PR

          This PR was generated by the Security Dependency Auto-Remediation workflow.

          **Before merging, security team must verify:**
          - [ ] All CVEs listed in the master issue are addressed
          - [ ] \`./gradlew clean build test\` passes (or Maven equivalent)
          - [ ] No new vulnerabilities introduced (\`./gradlew dependencyCheckAnalyze\`)
          - [ ] Repository config unchanged — no public registries added
          - [ ] Lock files updated if applicable

          ⚠️ **Do not merge without security team approval.**

          cc @${{ github.repository_owner }}/security-engineers" 2>/dev/null || true

  # ── Job 3: Auto-close sub-issues when master is closed ────────────────────
  close-sub-issues:
    name: Auto-close Sub-Issues
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'closed' &&
      contains(github.event.issue.labels.*.name, 'security-master')

    steps:
      - name: Close all open sub-issues
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Master issue #${{ github.event.issue.number }} was closed — closing sub-issues..."

          sub_issues=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "security-sub-issue" \
            --state open \
            --json number \
            --jq '.[].number')

          if [[ -z "$sub_issues" ]]; then
            echo "No open sub-issues found."
            exit 0
          fi

          closed_count=0
          for issue_num in $sub_issues; do
            echo "Closing sub-issue #${issue_num}..."
            gh issue close "${issue_num}" \
              --repo "${{ github.repository }}" \
              --comment "Closed automatically — fixed via master issue #${{ github.event.issue.number }}." || true
            closed_count=$((closed_count + 1))
            sleep 1
          done

          echo "Closed ${closed_count} sub-issue(s)."