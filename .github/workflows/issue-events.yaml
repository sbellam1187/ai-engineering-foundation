name: Handle Issue Events and Milestones

on:
  issues:
    types: [opened, closed, milestoned, assigned, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  security-events: write
  issues: write

jobs:
  handleIssueEvents:
    name: Handle Issue Events and Milestones
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          echo "$GITHUB_CONTEXT"

      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set milestone to Created, when issue is opened
        if: github.event.action == 'opened'
        uses: octokit/request-action@v2.x
        with:
          route: PATCH /repos/${{ github.repository }}/issues/${{ github.event.issue.number }}
          milestone: 1
          contentType: application/json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update milestone to Assigned, when issue is assigned
        if: github.event.action == 'assigned' && github.event.issue.state != 'closed' && !contains(fromJSON('[2,3]'), github.event.issue.milestone.number)
        uses: octokit/request-action@v2.x
        with:
          route: PATCH /repos/${{ github.repository }}/issues/${{ github.event.issue.number }}
          milestone: 4
          contentType: application/json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update milestone to Work In Progress, when comments are added in issue
        if: github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.state != 'closed' && !contains(fromJSON('[3]'), github.event.issue.milestone.number)
        uses: octokit/request-action@v2.x
        with:
          route: PATCH /repos/${{ github.repository }}/issues/${{ github.event.issue.number }}
          milestone: 2
          contentType: application/json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update milestone to Created, when issue is reopened
        if: github.event_name == 'issues' && github.event.action == 'reopened'
        uses: octokit/request-action@v2.x
        with:
          route: PATCH /repos/${{ github.repository }}/issues/${{ github.event.issue.number }}
          milestone: 1
          contentType: application/json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update issue to completed, when milestone is updated to Approved & Closed
        if: github.event_name == 'issues' && github.event.action == 'milestoned' && (github.event.issue.milestone.title == 'Approved & Closed')
        uses: octokit/request-action@v2.x
        with:
          route: PATCH /repos/${{ github.repository }}/issues/${{ github.event.issue.number }}
          data: '{"state": "closed", "state_reason": "completed"}'
          contentType: application/json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update milestone to Approved & Closed when issue is closed
        if: github.event_name == 'issues' && github.event.action == 'closed'
        uses: octokit/request-action@v2.x
        with:
          route: PATCH /repos/${{ github.repository }}/issues/${{ github.event.issue.number }}
          milestone: 3
          contentType: application/json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
