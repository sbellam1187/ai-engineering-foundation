# Copilot SonarQube Fix Workflow
# Artifact: workflow-quality-0001-copilot-sonar-fix
#
# Detects SonarQube issues introduced on the NEW code of a Pull Request and
# either:
#   - Comments on an already-open Copilot Sonar fix PR for this source branch, OR
#   - Reopens the previous closed sonar-fix issue with a refreshed body, OR
#   - Creates a new issue and assigns it to the Copilot coding agent.
#
# Reuse model (mirrors workflow-java-spring-0001-copilot-junit-writer):
#   - At most ONE Copilot Sonar fix PR per source PR branch.
#   - The Copilot agent's PR uses base = ${PR_HEAD_REF} (the source PR branch).
#     Head defaults to copilot/* (Copilot's standard naming convention).
#   - Re-runs caused by subsequent Sonarscan completions update the existing
#     PR/issue instead of spawning siblings.
#
# Patterns / agents followed:
#   - workflow: workflow-java-spring-0001-copilot-junit-writer.yml
#   - skill:    skill-quality-0002-sonarqube-review (crosscutting/quality/skills/)
#   - skill:    skill-java-spring-0003-java-unit-test-generator (runtimes/java-spring/skills/)
#   - agent:    agent-quality-0003-sonarqube-reviewer (crosscutting/quality/agents/)
#   - agent:    agent-java-spring-0001-junit-writer (runtimes/java-spring/agents/)
#   - ref:      workflow-security-0005-copilot-security-fix (crosscutting/security/workflows/)
#
# Triggers:
#   - workflow_run: after the SonarQube PR-analysis workflow completes
#   - workflow_dispatch: manual
#
# NOTE: pull_request trigger was removed to avoid duplicate runs — when a PR is
#       opened/synchronized the Sonarscan workflow runs first, and workflow_run
#       fires this workflow only after Sonarscan completes (correct timing).
#
# Secrets:
#   - octo-sts ephemeral token   -- issue + PR APIs (replaces GITHUB_TOKEN)
#   - DEPENDABOT_PAT            -- Copilot agent assignment via GraphQL
#   - SONARQUBE_TOKEN           -- SonarQube API token (Browse permission)
#                                  -- reuses the same secret as sonarqubeanalysis.yml
#
# Configuration (must be set per consuming repo):
#   - SONAR_HOST_URL    = <your SonarQube instance URL>
#   - SONAR_PROJECT_KEY = <your SonarQube project key>
#   - Sonarscan workflow name under workflow_run.workflows must match your repo

name: Copilot SonarQube Fix

on:

  workflow_run:
    # Name of the SonarQube PR-analysis workflow defined in sonarqubeanalysis.yml
    workflows: ["Sonarscan"]
    types: [completed]

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to scan for new-code Sonar issues'
        type: string
        required: true
      dry_run:
        description: 'Dry run -- fetch findings but do not create the issue'
        type: boolean
        required: false
        default: false

permissions:
  contents: read               # checkout
  id-token: write              # Required for octo-sts OIDC token exchange
  issues: write                # create / reopen / close issues, assign to Copilot agent
  pull-requests: write         # comment on source PR + on existing Copilot Sonar PR

jobs:
  sonar-fix:
    name: Detect Sonar New-Code Issues → Assign Copilot
    # Skip bot-triggered workflow_run events to avoid infinite loops.
    # The Copilot coding agent surfaces under several names:
    #   - copilot-swe-agent[bot]      (legacy actor format)
    #   - app/copilot-swe-agent       (gh CLI / GraphQL author format)
    #   - Copilot                     (new GitHub Copilot bot display login)
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login != 'copilot-swe-agent[bot]' &&
        github.event.workflow_run.actor.login != 'app/copilot-swe-agent' &&
        github.event.workflow_run.actor.login != 'Copilot') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Must exceed the script's strict-mode poll (20 min) + Copilot pickup
    # window (2 min) + issue/PR housekeeping. 30 min gives safe headroom.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.3.0
        with:
          fetch-depth: 0

      - name: Get ephemeral token via octo-sts
        id: octo-sts
        uses: octo-sts/action@615d088645880b32000c2fbd6ca04377d4df9142 # v1
        with:
          scope: ${{ github.repository }}
          identity: copilot-sonar-fix
          domain: octo-sts.cloud.aa.com

      - name: Resolve PR context
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUM_INPUT: ${{ github.event.inputs.pr_number }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          PR_NUM=""

          case "$EVENT_NAME" in
            workflow_dispatch) PR_NUM="$PR_NUM_INPUT" ;;
            workflow_run)
              PR_NUM=$(gh pr list --repo "$REPO" --state open \
                --search "$WR_HEAD_SHA" \
                --json number,headRefOid \
                --jq "[.[] | select(.headRefOid == \"$WR_HEAD_SHA\")] | first | .number // empty")
              if [ -z "$PR_NUM" ] && [ -n "$WR_HEAD_BRANCH" ]; then
                PR_NUM=$(gh pr list --repo "$REPO" --state open \
                  --head "$WR_HEAD_BRANCH" --json number --jq 'first | .number // empty')
              fi
              ;;
          esac

          if [ -z "$PR_NUM" ]; then
            echo "::warning::Could not resolve a PR number for event $EVENT_NAME -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_JSON=$(gh pr view "$PR_NUM" --repo "$REPO" \
            --json number,headRefName,headRefOid,baseRefName,author,state)
          BASE_REF=$(echo "$PR_JSON" | jq -r '.baseRefName')
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.headRefName')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.headRefOid')
          AUTHOR=$(echo "$PR_JSON"   | jq -r '.author.login')
          STATE=$(echo "$PR_JSON"    | jq -r '.state')

          if [ "$STATE" != "OPEN" ]; then
            echo "::notice::PR #$PR_NUM is $STATE -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD_REF" = "master" ] || [ "$HEAD_REF" = "main" ]; then
            echo "::notice::PR head is $HEAD_REF -- skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Defense in depth: never run on Copilot's own fix PRs, or PRs from a copilot/* head branch.
          case "$AUTHOR" in
            copilot-swe-agent|copilot-swe-agent[bot]|app/copilot-swe-agent|Copilot|dependabot|dependabot[bot]|github-actions|github-actions[bot])
              echo "::notice::PR #$PR_NUM author is bot '$AUTHOR' -- skipping to avoid loops"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          case "$HEAD_REF" in
            copilot/*)
              echo "::notice::PR #$PR_NUM head branch is '$HEAD_REF' (Copilot fix branch) -- skipping to avoid loops"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          {
            echo "pr_number=$PR_NUM"
            echo "head_ref=$HEAD_REF"
            echo "head_sha=$HEAD_SHA"
            echo "base_ref=$BASE_REF"
            echo "author=$AUTHOR"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$PR_NUM ($HEAD_REF @ ${HEAD_SHA:0:7} -> $BASE_REF) by @$AUTHOR"

      - name: Ensure required labels exist
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          for label in sonarqube code-quality copilot-sonar-fix; do
            gh label create "$label" --color "1d76db" \
              --description "Auto-created by workflow-quality-0001-copilot-sonar-fix" \
              --force --repo "${{ github.repository }}" 2>/dev/null || true
          done

      - name: Detect Sonar new-code issues and assign Copilot
        if: steps.pr.outputs.skip != 'true'
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          DEPENDABOT_PAT: ${{ secrets.DEPENDABOT_PAT }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          PR_NUM: ${{ steps.pr.outputs.pr_number }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_BASE_REF: ${{ steps.pr.outputs.base_ref }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          # `loose` for manual runs (Sonar already done, just use whatever exists, ~2 min cap)
          # `strict` for PR / workflow_run (wait up to 20 min for the analysis to match PR_HEAD_SHA)
          WAIT_MODE: ${{ github.event_name == 'workflow_dispatch' && 'loose' || 'strict' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          chmod +x scripts/copilot-sonar/copilot-sonar-fix.sh
          scripts/copilot-sonar/copilot-sonar-fix.sh
